services:
  webtools:
    build: .
    image: webtools:1.0.0
    container_name: webtools
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      WEB_CONCURRENCY: 2
      GUNICORN_TIMEOUT: 60
      LOG_LEVEL: info
      NODE_IP: 10.10.10.10
      NODE_NAME: host-node-1
      EGRESS_IP: node1
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
