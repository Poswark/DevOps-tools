# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run tests with pytest
      run: |
        python3 -m coverage run -m pytest
    - name: Coverage
      run: |
        coverage report  -m
  # Nuevo trabajo para construir y subir la imagen a Docker Hub
  push_to_dockerhub:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set Docker image version
        id: vars
        run: echo "IMAGE_VERSION=v1.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t poswark/link-connection-api:${{ env.IMAGE_VERSION }} .

      # Instala Trivy y ejecuta el escaneo
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/download/v0.40.0/trivy_0.40.0_Linux-64bit.deb
          sudo dpkg -i trivy_0.40.0_Linux-64bit.deb

      - name: Scan Docker image with Trivy
        run: |
          # Escanea la imagen en busca de vulnerabilidades y falla si encuentra de nivel HIGH o CRITICAL
          trivy image --exit-code 1 --severity HIGH,CRITICAL poswark/link-conection:${{ env.IMAGE_VERSION }}

      - name: Push Docker image with version
        if: success()  # Solo sube la imagen si el escaneo de Trivy pasa sin vulnerabilidades de nivel alto o crítico
        run: docker push poswark/link-conection:${{ env.IMAGE_VERSION }}
